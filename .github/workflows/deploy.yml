name: Deploy to Amazon ECR

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t pelayanan-desa-app .

      - name: Tag Docker Image
        run: |
          docker tag pelayanan-desa-app:latest 775296258596.dkr.ecr.ap-southeast-1.amazonaws.com/pelayanan-desa-app:latest

      - name: Push Docker Image to ECR
        run: |
          docker push 775296258596.dkr.ecr.ap-southeast-1.amazonaws.com/pelayanan-desa-app:latest